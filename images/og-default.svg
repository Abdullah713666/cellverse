<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0a0f1a"/>
            <stop offset="100%" stop-color="#1a1f2e"/>
        </linearGradient>
        <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#00d4aa"/>
            <stop offset="100%" stop-color="#7c3aed"/>
        </linearGradient>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0,212,170,0.12)" stroke-width="1"/>
        </pattern>
    </defs>
    <rect width="1200" height="630" fill="url(#bg)"/>
    <rect width="1200" height="630" fill="url(#grid)"/>
    <circle cx="950" cy="120" r="180" fill="rgba(0,212,170,0.12)"/>
    <circle cx="200" cy="500" r="220" fill="rgba(124,58,237,0.14)"/>
    <g transform="translate(80, 200)">
        <rect x="0" y="0" width="120" height="200" rx="18" fill="none" stroke="url(#logo)" stroke-width="6"/>
        <circle cx="60" cy="180" r="10" fill="url(#logo)"/>
        <rect x="30" y="20" width="60" height="120" rx="6" fill="url(#logo)" opacity="0.35"/>
    </g>
    <text x="240" y="290" font-family="Space Grotesk, system-ui, sans-serif" font-size="92" font-weight="700" fill="#ffffff">Cell<tspan fill="url(#logo)">Verse</tspan></text>
    <text x="240" y="360" font-family="DM Sans, system-ui, sans-serif" font-size="34" font-weight="500" fill="#a0aec0">Wholesale Mobile Accessories, Pakistan</text>
    <text x="80" y="560" font-family="DM Sans, system-ui, sans-serif" font-size="22" font-weight="400" fill="#64748b">Bulk pricing for retailers, resellers, and distributors.</text>
</svg>
